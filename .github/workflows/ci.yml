name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and replay evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
      - run: python scripts/evaluate_replay.py
      - run: python scripts/evaluate_external.py
      - run: python scripts/evaluate_hero.py --project data/l1_project/hero_battery_factory_project.xlsx --ground-truth data/l3_ground_truth/ground_truth.json --mapping data/l1_project/l3_to_wbs_mapping.json --eval-dir data/evaluation --output artifacts/hero_evaluation.json
      - run: python scripts/evaluate_agent.py --mode mock --output artifacts/agent_evaluation.json

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  deploy:
    name: Deploy main to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, compose]
    runs-on: [self-hosted, replan-ec2]
    concurrency:
      group: production-ec2
      cancel-in-progress: false
    steps:
      - name: Pull main and restart Compose locally
        run: |
          set -eu
          cd "$HOME/ai-innovators-challenge"
          test -z "$(git status --porcelain)" || {
            echo "EC2 working tree is dirty; refusing to deploy over local changes." >&2
            exit 1
          }
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          docker compose up -d --build
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -o /dev/null http://127.0.0.1:3000/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Web health check did not become ready in time." >&2
              exit 1
            fi
            sleep 2
          done
