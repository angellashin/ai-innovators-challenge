name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and replay evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
      - run: python scripts/evaluate_replay.py
      - run: python scripts/evaluate_external.py
      - run: python scripts/evaluate_hero.py --project data/l1_project/hero_battery_factory_project.xlsx --ground-truth data/l3_ground_truth/ground_truth.json --mapping data/l1_project/l3_to_wbs_mapping.json --eval-dir data/evaluation --output artifacts/hero_evaluation.json
      - run: python scripts/evaluate_agent.py --mode mock --output artifacts/agent_evaluation.json

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: bash -n deploy/aws/install-auto-deploy.sh
      - run: python -m py_compile deploy/aws/auto_deploy.py
